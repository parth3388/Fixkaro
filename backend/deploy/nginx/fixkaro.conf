# FIX-KAR production Nginx site config.
#
# Deploys manually to /etc/nginx/sites-available/fixkaro (see
# backend/README.md "Nginx configuration overview" for the one-time
# activation steps). This file is intentionally kept under backend/, which
# the deploy workflow's rsync excludes from /var/www/fixkaro/ — keeping it
# anywhere under the frontend root would let Nginx serve this file itself as
# plain text to the public.
#
# Static root matches the real deploy.yml rsync target: /var/www/fixkaro/.

server {
    listen 80;
    listen [::]:80;
    server_name fix-kar.in www.fix-kar.in;

    root /var/www/fixkaro;
    index index.html;

    # FastAPI backend. A plain (non-regex) location, so Nginx's longest-
    # prefix-match rule alone guarantees this wins over the "/" block below
    # for every /api/v1/... request — the ordering here doesn't matter, but
    # it's listed first for readability. Never falls through to try_files.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /index.html -> / (the canonical home URL; not /index).
    location = /index.html {
        return 301 /;
    }

    # Any other direct *.html request -> its extensionless URL, e.g.
    # /services.html -> /services. 301 (permanent) so browsers/search
    # engines update to the canonical URL.
    location ~ ^/([a-z0-9-]+)\.html$ {
        return 301 /$1;
    }

    # Extensionless routing for everything else: /services internally
    # serves services.html from disk without changing the browser URL.
    # $uri first (so real files/assets like /assets/logo.png, /styles.css,
    # /script.js keep working exactly as before), then $uri.html, then
    # directory index, then 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
