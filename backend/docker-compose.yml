services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fixkar
      POSTGRES_PASSWORD: fixkar
      POSTGRES_DB: fixkar
    ports:
      # Host port 5433 avoids clashing with a locally-installed PostgreSQL
      # service that may already be bound to 5432.
      - "5433:5432"
    volumes:
      - fixkar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixkar -d fixkar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://fixkar:fixkar@db:5432/fixkar
      CORS_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
      SECRET_KEY: dev-only-secret
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

volumes:
  fixkar_pgdata:
